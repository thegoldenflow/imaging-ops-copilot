# Server deployment: images pulled from Docker Hub, site bound to loopback behind the
# host's Caddy (HTTPS). See docs/DEPLOY.md.
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# Reads .env next to this file: API_IMAGE / WEB_IMAGE / WEB_PORT / POSTGRES_PASSWORD plus
# the API settings from apps/api/.env.example (PHI_ENCRYPTION_KEY and PHI_BLIND_INDEX_KEY are required).

name: imaging-ops

services:
  postgres:
    image: postgres:16-alpine
    container_name: ioc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ioc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ioc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ioc -d ioc"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No published port: only the API container reaches it, on the compose network.

  api:
    image: ${API_IMAGE:?set API_IMAGE=<dockerhub user>/imaging-ops-api:<tag> in .env}
    container_name: ioc_api
    restart: unless-stopped
    # Set DEMO_PASSCODE in .env to require a passcode on the login page; without it
    # anyone with the URL can use the site (Caddy's access log records who did).
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://ioc:${POSTGRES_PASSWORD}@postgres:5432/ioc
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE=<dockerhub user>/imaging-ops-web:<tag> in .env}
    container_name: ioc_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Loopback only; Caddy on the host terminates HTTPS and proxies here.
      - "127.0.0.1:${WEB_PORT:-8088}:80"

  # Optional: durable workflows (docs/SPEC-hospital.md 6.5; not needed in production, every module works without
  # them). Start with `docker compose -f docker-compose.prod.yml --profile workflows up -d` and set
  # TEMPORAL_ADDRESS=temporal:7233 in .env (the API reads it from there). Temporal's single-container dev server keeps
  # its history in a SQLite file in a volume; its web UI is published on loopback only (ssh -L 8233:127.0.0.1:8233).
  temporal:
    image: temporalio/temporal:1.8.3
    container_name: ioc_temporal
    profiles: ["workflows"]
    restart: unless-stopped
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--namespace", "hospital-demo",
              "--db-filename", "/home/temporal/temporal.db", "--ui-port", "8233", "--log-level", "warn"]
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8233"
    volumes:
      - temporaldata:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "namespace", "describe", "--namespace", "hospital-demo",
             "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    image: ${API_IMAGE:?set API_IMAGE=<dockerhub user>/imaging-ops-api:<tag> in .env}
    container_name: ioc_worker
    profiles: ["workflows"]
    restart: unless-stopped
    command: ["python", "-m", "app.workflows.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://ioc:${POSTGRES_PASSWORD}@postgres:5432/ioc
      TEMPORAL_ADDRESS: temporal:7233
    healthcheck:
      disable: true # the image's check calls the HTTP API, which the worker does not serve
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy

volumes:
  pgdata:
  temporaldata:
