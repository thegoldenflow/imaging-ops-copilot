# Template: ${API_UPSTREAM} is substituted by the nginx image at start.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Chest X-ray uploads go through /api/reports/upload.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI calls can take a while (LLM_TIMEOUT_S plus retries).
        proxy_read_timeout 120s;
    }

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes fall back to the app shell, which is never cached.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
