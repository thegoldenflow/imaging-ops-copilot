# Tool registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# side_effect_level read / recommend / action / privileged; schemas are JSON Schema (the subset in
# app/agents/jsonschema.py); fhir_writes is what the tool may write (agents' write rights derive from it).
tool_id: submitForReview
description: Put a recommendation into a person's review queue (a Task with intent proposal).
side_effect_level: recommend
handler: app.agents.handlers:submit_for_review
domain: fhir
fhir_writes:
  Task:
  - requested
input_schema:
  type: object
  properties:
    encounter_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    reviewer_role:
      type: string
      enum:
      - physician
      - nurse
      - pharmacist
      - clerk
      - operations_manager
    summary:
      type: string
      minLength: 1
      maxLength: 300
    recommendation:
      type: string
      minLength: 1
      maxLength: 4000
    evidence_refs:
      type: array
      items:
        type: string
        pattern: ^[A-Z][A-Za-z]+/[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
      maxItems: 50
    priority:
      type: string
      enum:
      - routine
      - urgent
      - asap
      - stat
  required:
  - encounter_id
  - reviewer_role
  - summary
  - recommendation
  additionalProperties: false
output_schema:
  type: object
  properties:
    task_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    status:
      type: string
  required:
  - task_id
  - status
  additionalProperties: false
permission_policy:
  roles:
  - physician
  - nurse
  - pharmacist
  - clerk
  - operations_manager
  - system
  target:
    encounter: encounter_id
idempotency:
  required: true
  window_hours: 24
timeout_ms: 5000
retry:
  max_attempts: 2
  backoff_ms: 50
audit_level: detailed
