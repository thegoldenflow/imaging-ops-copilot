# Tool registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# side_effect_level read / recommend / action / privileged; schemas are JSON Schema (the subset in
# app/agents/jsonschema.py); fhir_writes is what the tool may write (agents' write rights derive from it).
tool_id: updateTask
description: Change a task's status (start, complete, cancel, ...).
side_effect_level: action
handler: app.agents.handlers:update_task
domain: fhir
fhir_writes:
  Task:
  - '*'
input_schema:
  type: object
  properties:
    task_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    status:
      type: string
      enum:
      - accepted
      - in-progress
      - on-hold
      - completed
      - cancelled
      - failed
      - rejected
    note:
      type: string
      maxLength: 1000
  required:
  - task_id
  - status
  additionalProperties: false
output_schema:
  type: object
  properties:
    task_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    status:
      type: string
  required:
  - task_id
  - status
  additionalProperties: false
permission_policy:
  roles:
  - physician
  - nurse
  - pharmacist
  - clerk
  - operations_manager
  - system
  target:
    task: task_id
idempotency:
  required: true
  window_hours: 24
timeout_ms: 5000
retry:
  max_attempts: 2
  backoff_ms: 50
audit_level: detailed
