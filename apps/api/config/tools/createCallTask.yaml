# Tool registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# side_effect_level read / recommend / action / privileged; schemas are JSON Schema (the subset in
# app/agents/jsonschema.py); fhir_writes is what the tool may write (agents' write rights derive from it).
tool_id: createCallTask
description: 'A work item from a phone call (7.4): a call to transfer or return (clerk), a question for the nurse line,
  a follow-up escalation or manual follow-up (nurse), a referral (physician). The patient may be unknown (a caller
  who could not be verified).'
side_effect_level: action
handler: app.modules.voice_services.tools:create_call_task
domain: fhir
fhir_writes:
  Task:
  - requested
input_schema:
  type: object
  properties:
    patient_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    encounter_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    code:
      type: string
      enum:
      - call-transfer
      - nurse-line
      - followup-escalation
      - followup-manual
      - followup-referral
    description:
      type: string
      minLength: 1
      maxLength: 1000
    performer_role:
      type: string
      enum:
      - physician
      - nurse
      - clerk
    priority:
      type: string
      enum:
      - routine
      - urgent
      - asap
      - stat
    focus:
      type: string
      pattern: ^[A-Z][A-Za-z]+/[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    call_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
  required:
  - code
  - description
  - performer_role
  additionalProperties: false
output_schema:
  type: object
  properties:
    task_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    status:
      type: string
  required:
  - task_id
  - status
  additionalProperties: false
permission_policy:
  roles:
  - physician
  - nurse
  - clerk
  - system
  target:
    encounter: encounter_id
    patient: patient_id
idempotency:
  required: true
  window_hours: 24
timeout_ms: 5000
retry:
  max_attempts: 2
  backoff_ms: 50
audit_level: detailed
