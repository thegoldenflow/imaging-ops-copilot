# Tool registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# side_effect_level read / recommend / action / privileged; schemas are JSON Schema (the subset in
# app/agents/jsonschema.py); fhir_writes is what the tool may write (agents' write rights derive from it).
tool_id: draftDocument
description: Write a draft document (docStatus preliminary) for the agent's signers to review.
side_effect_level: recommend
handler: app.agents.handlers:draft_document
domain: fhir
fhir_writes:
  DocumentReference:
  - preliminary
input_schema:
  type: object
  properties:
    encounter_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    doc_type:
      type: string
      enum:
      - discharge_summary
      - patient_instructions
      - medrec
      - handoff
      - discharge_med_list
      - progress_note
    title:
      type: string
      minLength: 1
      maxLength: 200
    text:
      type: string
      minLength: 1
      maxLength: 20000
    source_refs:
      type: array
      items:
        type: string
        pattern: ^[A-Z][A-Za-z]+/[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
      maxItems: 200
  required:
  - encounter_id
  - doc_type
  - title
  - text
  additionalProperties: false
output_schema:
  type: object
  properties:
    document_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    doc_status:
      type: string
  required:
  - document_id
  - doc_status
  additionalProperties: false
permission_policy:
  roles:
  - physician
  - nurse
  - pharmacist
  - system
  target:
    encounter: encounter_id
idempotency:
  required: true
  window_hours: 24
timeout_ms: 5000
retry:
  max_attempts: 2
  backoff_ms: 50
audit_level: detailed
