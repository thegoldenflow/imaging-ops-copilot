# Tool registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# side_effect_level read / recommend / action / privileged; schemas are JSON Schema (the subset in
# app/agents/jsonschema.py); fhir_writes is what the tool may write (agents' write rights derive from it).
tool_id: getDischargeMedications
description: The encounter's discharge medication table (WP6, spec 7.2 step 5) with its status (final only after
  the pharmacist signed and a physician co-signed) and the discharge reconciliation record it comes from.
side_effect_level: read
handler: app.modules.documentation.tools:get_discharge_medications
domain: fhir
reads:
- DocumentReference
input_schema:
  type: object
  properties:
    encounter_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
  required:
  - encounter_id
  additionalProperties: false
output_schema:
  type: object
  properties:
    resources:
      type: array
      items:
        type: object
    table:
      anyOf:
      - type: object
      - type: 'null'
  required:
  - resources
  - table
  additionalProperties: false
permission_policy:
  roles:
  - physician
  - nurse
  - pharmacist
  - system
  target:
    encounter: encounter_id
idempotency:
  required: false
timeout_ms: 5000
retry:
  max_attempts: 2
  backoff_ms: 50
audit_level: standard
