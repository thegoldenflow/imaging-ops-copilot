# Tool registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# side_effect_level read / recommend / action / privileged; schemas are JSON Schema (the subset in
# app/agents/jsonschema.py); fhir_writes is what the tool may write (agents' write rights derive from it).
tool_id: draftMedRec
description: 'Write (or update) the draft medication reconciliation record of an encounter: a DocumentReference with
  docStatus preliminary, kind admission or discharge, a readable text and the structured reconciliation (7.2).
  Without document_id it writes the record of the stay (medrec-<encounter>-<kind>), creating it or updating its
  draft. Only the signing service makes it final; a signed record is not rewritten.'
side_effect_level: recommend
handler: app.modules.med_safety.tools:draft_medrec
domain: fhir
fhir_writes:
  DocumentReference:
  - preliminary
input_schema:
  type: object
  properties:
    encounter_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    session_id:
      type: string
      pattern: ^MR-[0-9]{5,}$
    kind:
      type: string
      enum:
      - admission
      - discharge
    text:
      type: string
      minLength: 1
      maxLength: 30000
    data:
      type: string
      minLength: 2
      maxLength: 100000
    document_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    source_refs:
      type: array
      maxItems: 200
      items:
        type: string
        pattern: ^[A-Z][A-Za-z]+/[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
  required:
  - encounter_id
  - session_id
  - kind
  - text
  - data
  additionalProperties: false
output_schema:
  type: object
  properties:
    document_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    doc_status:
      type: string
  required:
  - document_id
  - doc_status
  additionalProperties: false
permission_policy:
  roles:
  - pharmacist
  - physician
  - system
  target:
    encounter: encounter_id
idempotency:
  required: true
  window_hours: 24
timeout_ms: 5000
retry:
  max_attempts: 2
  backoff_ms: 50
audit_level: detailed
