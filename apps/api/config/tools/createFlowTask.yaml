# Tool registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# side_effect_level read / recommend / action / privileged; schemas are JSON Schema (the subset in
# app/agents/jsonschema.py); fhir_writes is what the tool may write (agents' write rights derive from it).
#
# Called by the Control Tower only after a bed manager or charge nurse approved the action (approve audit
# event on the exception's review Task); the Task goes to the action's owner role. A unit-level action has no
# patient (focus: the unit's Location); a patient-level one names its encounter.
tool_id: createFlowTask
description: Create the work item of an approved Control Tower action for its owner role.
side_effect_level: action
handler: app.modules.control_tower.tools:create_flow_task
domain: fhir
fhir_writes:
  Task:
  - requested
input_schema:
  type: object
  properties:
    exception_id:
      type: string
      pattern: ^EXC-[0-9]{5,}$
    action_id:
      type: string
      pattern: ^[a-z][a-z0-9_]{1,40}$
    unit_id:
      type: string
      pattern: ^[A-Z]{2,5}$
    encounter_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    description:
      type: string
      minLength: 1
      maxLength: 1000
    performer_role:
      type: string
      enum:
      - physician
      - nurse
      - operations_manager
    priority:
      type: string
      enum:
      - routine
      - urgent
      - asap
    review_task_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    approved_by:
      type: string
      pattern: ^U-[A-Z0-9-]{1,40}$
  required:
  - exception_id
  - action_id
  - unit_id
  - description
  - performer_role
  - priority
  - review_task_id
  - approved_by
  additionalProperties: false
output_schema:
  type: object
  properties:
    task_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    status:
      type: string
  required:
  - task_id
  - status
  additionalProperties: false
permission_policy:
  roles:
  - operations_manager
  - nurse
  - system
  target:
    unit: unit_id
idempotency:
  required: true
  window_hours: 24
timeout_ms: 5000
retry:
  max_attempts: 2
  backoff_ms: 50
audit_level: detailed
