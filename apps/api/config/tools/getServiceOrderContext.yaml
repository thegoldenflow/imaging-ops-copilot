# Tool registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# side_effect_level read / recommend / action / privileged; schemas are JSON Schema (the subset in
# app/agents/jsonschema.py); fhir_writes is what the tool may write (agents' write rights derive from it).
tool_id: getServiceOrderContext
description: 'A lab or imaging order and the same test ordered for the patient in the 72 hours before it, with their
  results (the duplicate-test context of the order review, 7.2).'
side_effect_level: read
handler: app.modules.med_safety.tools:get_service_order_context
domain: fhir
reads:
- ServiceRequest
- Observation
- DiagnosticReport
input_schema:
  type: object
  properties:
    encounter_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    order_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
  required:
  - encounter_id
  - order_id
  additionalProperties: false
output_schema:
  type: object
  properties:
    resources:
      type: array
      items:
        type: object
  required:
  - resources
  additionalProperties: false
permission_policy:
  roles:
  - physician
  - system
  target:
    encounter: encounter_id
idempotency:
  required: false
timeout_ms: 5000
retry:
  max_attempts: 2
  backoff_ms: 50
audit_level: standard
