# Tool registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# side_effect_level read / recommend / action / privileged; schemas are JSON Schema (the subset in
# app/agents/jsonschema.py); fhir_writes is what the tool may write (agents' write rights derive from it).
tool_id: appendEncounterLocation
description: Move a patient to a free bed after a bed manager approved it.
side_effect_level: privileged
handler: app.agents.handlers:append_encounter_location
domain: fhir
fhir_writes:
  Encounter.location:
  - append
input_schema:
  type: object
  properties:
    encounter_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    bed_id:
      type: string
      pattern: ^[A-Z]{2,5}-\d{2}-[A-Z]$
    approval_task_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
  required:
  - encounter_id
  - bed_id
  - approval_task_id
  additionalProperties: false
output_schema:
  type: object
  properties:
    encounter_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    bed_id:
      type: string
  required:
  - encounter_id
  - bed_id
  additionalProperties: false
permission_policy:
  roles:
  - operations_manager
  - nurse
  - system
  approver_roles:
  - operations_manager
  target:
    encounter: encounter_id
idempotency:
  required: true
  window_hours: 24
timeout_ms: 5000
retry:
  max_attempts: 1
  backoff_ms: 0
audit_level: double
