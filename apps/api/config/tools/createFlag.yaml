# Tool registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# side_effect_level read / recommend / action / privileged; schemas are JSON Schema (the subset in
# app/agents/jsonschema.py); fhir_writes is what the tool may write (agents' write rights derive from it).
tool_id: createFlag
description: Raise a safety flag on an encounter (fall risk, isolation, ...).
side_effect_level: action
handler: app.agents.handlers:create_flag
domain: fhir
fhir_writes:
  Flag:
  - active
input_schema:
  type: object
  properties:
    encounter_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    code:
      type: string
      pattern: ^[a-z][a-z0-9-]{1,40}$
    display:
      type: string
      minLength: 1
      maxLength: 200
  required:
  - encounter_id
  - code
  - display
  additionalProperties: false
output_schema:
  type: object
  properties:
    flag_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    status:
      type: string
  required:
  - flag_id
  - status
  additionalProperties: false
permission_policy:
  roles:
  - physician
  - nurse
  - pharmacist
  - operations_manager
  - system
  target:
    encounter: encounter_id
idempotency:
  required: true
  window_hours: 24
timeout_ms: 5000
retry:
  max_attempts: 2
  backoff_ms: 50
audit_level: detailed
