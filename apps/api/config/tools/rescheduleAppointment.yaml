# Tool registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# side_effect_level read / recommend / action / privileged; schemas are JSON Schema (the subset in
# app/agents/jsonschema.py); fhir_writes is what the tool may write (agents' write rights derive from it).
tool_id: rescheduleAppointment
description: Move the verified caller's appointment to a slot from findOpenSlots (after the caller confirmed).
side_effect_level: action
handler: app.modules.frontdesk.tools:registered_tool
domain: imaging_frontdesk
input_schema:
  type: object
  properties:
    appointment_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    slot_id:
      type: string
      maxLength: 100
  required:
  - appointment_id
  - slot_id
  additionalProperties: false
output_schema:
  type: object
permission_policy:
  roles:
  - front_desk
  - operations_manager
  - admin
  - system
idempotency:
  required: true
  window_hours: 24
timeout_ms: 3000
retry:
  max_attempts: 2
  backoff_ms: 50
audit_level: detailed
