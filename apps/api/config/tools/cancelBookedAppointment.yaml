# Tool registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# side_effect_level read / recommend / action / privileged; schemas are JSON Schema (the subset in
# app/agents/jsonschema.py); fhir_writes is what the tool may write (agents' write rights derive from it).
tool_id: cancelBookedAppointment
description: Cancel a patient's appointment after a clerk approved the request (7.4; the call centre only asks).
side_effect_level: privileged
handler: app.modules.voice_services.tools:cancel_booked_appointment
domain: fhir
fhir_writes:
  Appointment:
  - cancelled
input_schema:
  type: object
  properties:
    appointment_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    reason:
      type: string
      minLength: 1
      maxLength: 200
    approval_task_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
  required:
  - appointment_id
  - reason
  - approval_task_id
  additionalProperties: false
output_schema:
  type: object
  properties:
    appointment_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    status:
      type: string
  required:
  - appointment_id
  - status
  additionalProperties: false
permission_policy:
  roles:
  - physician
  - nurse
  - clerk
  - system
  approver_roles:
  - clerk
  target:
    appointment: appointment_id
idempotency:
  required: true
  window_hours: 24
timeout_ms: 5000
retry:
  max_attempts: 1
  backoff_ms: 0
audit_level: double
