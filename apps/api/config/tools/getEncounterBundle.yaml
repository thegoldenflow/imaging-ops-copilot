# Tool registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# side_effect_level read / recommend / action / privileged; schemas are JSON Schema (the subset in
# app/agents/jsonschema.py); fhir_writes is what the tool may write (agents' write rights derive from it).
tool_id: getEncounterBundle
description: 'Everything recorded on an encounter: conditions, procedures, medication orders, observations, reports,
  orders, tasks, care plans, documents, flags (the types the agent may read).'
side_effect_level: read
handler: app.agents.handlers:get_encounter_bundle
domain: fhir
reads:
- Encounter
- Patient
- Condition
- Procedure
- MedicationRequest
- Observation
- DiagnosticReport
- ServiceRequest
- Task
- CarePlan
- DocumentReference
- Flag
input_schema:
  type: object
  properties:
    encounter_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
  required:
  - encounter_id
  additionalProperties: false
output_schema:
  type: object
  properties:
    resources:
      type: array
      items:
        type: object
  required:
  - resources
  additionalProperties: false
permission_policy:
  roles:
  - physician
  - nurse
  - pharmacist
  - system
  target:
    encounter: encounter_id
idempotency:
  required: false
timeout_ms: 8000
retry:
  max_attempts: 2
  backoff_ms: 50
audit_level: standard
