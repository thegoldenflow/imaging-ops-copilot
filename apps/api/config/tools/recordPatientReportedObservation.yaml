# Tool registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# side_effect_level read / recommend / action / privileged; schemas are JSON Schema (the subset in
# app/agents/jsonschema.py); fhir_writes is what the tool may write (agents' write rights derive from it).
tool_id: recordPatientReportedObservation
description: 'Record a symptom the patient reported on a follow-up call (7.4) as an Observation, category
  patient-reported, status preliminary (what the patient said, not a measurement); a temperature the patient read
  out is kept as its value.'
side_effect_level: action
handler: app.modules.voice_services.tools:record_patient_reported_observation
domain: fhir
fhir_writes:
  Observation:
  - preliminary
input_schema:
  type: object
  properties:
    encounter_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    code:
      type: string
      pattern: ^[a-z][a-z0-9_]{1,40}$
    display:
      type: string
      minLength: 1
      maxLength: 120
    text:
      type: string
      minLength: 1
      maxLength: 1000
    temperature_c:
      type: number
      minimum: 30
      maximum: 45
    communication_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    red_flag:
      type: boolean
  required:
  - encounter_id
  - code
  - display
  - text
  additionalProperties: false
output_schema:
  type: object
  properties:
    observation_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    status:
      type: string
  required:
  - observation_id
  - status
  additionalProperties: false
permission_policy:
  roles:
  - nurse
  - system
  target:
    encounter: encounter_id
idempotency:
  required: true
  window_hours: 24
timeout_ms: 5000
retry:
  max_attempts: 2
  backoff_ms: 50
audit_level: detailed
