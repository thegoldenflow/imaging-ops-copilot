# Tool registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# side_effect_level read / recommend / action / privileged; schemas are JSON Schema (the subset in
# app/agents/jsonschema.py); fhir_writes is what the tool may write (agents' write rights derive from it).
tool_id: recordProvenance
description: The runtime records the FHIR Provenance of a run's output (not callable by agents).
side_effect_level: action
handler: app.agents.handlers:record_provenance
domain: runtime
fhir_writes:
  Provenance:
  - '*'
input_schema:
  type: object
  properties:
    provenance:
      type: object
  required:
  - provenance
  additionalProperties: false
output_schema:
  type: object
  properties:
    provenance_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
  required:
  - provenance_id
  additionalProperties: false
permission_policy:
  roles:
  - system
idempotency:
  required: true
  window_hours: 24
timeout_ms: 5000
retry:
  max_attempts: 2
  backoff_ms: 50
audit_level: detailed
internal: true
