# Tool registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# side_effect_level read / recommend / action / privileged; schemas are JSON Schema (the subset in
# app/agents/jsonschema.py); fhir_writes is what the tool may write (agents' write rights derive from it).
tool_id: signDocumentFinal
description: Make an approved draft final through the signing service, signed by the person who approved it.
side_effect_level: privileged
handler: app.agents.handlers:sign_document_final
domain: signing
fhir_writes:
  DocumentReference:
  - final
input_schema:
  type: object
  properties:
    document_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    approval_task_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
  required:
  - document_id
  - approval_task_id
  additionalProperties: false
output_schema:
  type: object
  properties:
    document_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    doc_status:
      type: string
    signed_roles:
      type: array
      items:
        type: string
    missing_roles:
      type: array
      items:
        type: string
  required:
  - document_id
  - doc_status
  - signed_roles
  - missing_roles
  additionalProperties: false
permission_policy:
  roles:
  - physician
  - nurse
  - pharmacist
  - system
  approver_roles: signoff
  target:
    document: document_id
idempotency:
  required: true
  window_hours: 24
timeout_ms: 5000
retry:
  max_attempts: 1
  backoff_ms: 0
audit_level: double
