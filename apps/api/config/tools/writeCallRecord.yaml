# Tool registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# side_effect_level read / recommend / action / privileged; schemas are JSON Schema (the subset in
# app/agents/jsonschema.py); fhir_writes is what the tool may write (agents' write rights derive from it).
tool_id: writeCallRecord
description: 'Record a phone call (7.4) as a Communication: a call-centre request, prep instructions given, a question
  for the nurse line, or a follow-up call (status, summary, escalated flag). With communication_id it updates that
  call record (the follow-up call: scheduled, in progress, completed). It places no call and sends nothing.'
side_effect_level: action
handler: app.modules.voice_services.tools:write_call_record
domain: fhir
fhir_writes:
  Communication:
  - '*'
input_schema:
  type: object
  properties:
    patient_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    encounter_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    communication_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    kind:
      type: string
      enum:
      - call-centre
      - prep-instructions
      - nurse-line
      - followup-call
      - nurse-callback
      - nurse-referral
      - nurse-close
    direction:
      type: string
      enum:
      - inbound
      - outbound
    status:
      type: string
      enum:
      - preparation
      - in-progress
      - completed
      - not-done
    text:
      type: string
      minLength: 1
      maxLength: 8000
    language:
      type: string
      pattern: ^[a-z]{2}(-[A-Za-z]{2,4})?$
    escalated:
      type: boolean
    priority:
      type: string
      enum:
      - routine
      - urgent
      - asap
      - stat
    status_reason:
      type: string
      maxLength: 300
    about:
      type: array
      maxItems: 10
      items:
        type: string
        pattern: ^[A-Z][A-Za-z]+/[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
  required:
  - patient_id
  - kind
  - direction
  - status
  - text
  additionalProperties: false
output_schema:
  type: object
  properties:
    communication_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    status:
      type: string
  required:
  - communication_id
  - status
  additionalProperties: false
permission_policy:
  roles:
  - physician
  - nurse
  - clerk
  - system
  target:
    encounter: encounter_id
    patient: patient_id
idempotency:
  required: true
  window_hours: 24
timeout_ms: 5000
retry:
  max_attempts: 2
  backoff_ms: 50
audit_level: detailed
