# Tool registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# side_effect_level read / recommend / action / privileged; schemas are JSON Schema (the subset in
# app/agents/jsonschema.py); fhir_writes is what the tool may write (agents' write rights derive from it).
tool_id: getBedBoard
description: Beds of a unit with status, occupant encounter and since when, plus patients waiting.
side_effect_level: read
handler: app.agents.handlers:get_bed_board
domain: fhir
reads:
- Location
- Encounter
input_schema:
  type: object
  properties:
    unit_id:
      type: string
      pattern: ^[A-Z]{2,5}$
  required:
  - unit_id
  additionalProperties: false
output_schema:
  type: object
  properties:
    board:
      type: object
  required:
  - board
  additionalProperties: false
permission_policy:
  roles:
  - physician
  - nurse
  - operations_manager
  - system
  target:
    unit: unit_id
idempotency:
  required: false
timeout_ms: 5000
retry:
  max_attempts: 2
  backoff_ms: 50
audit_level: standard
