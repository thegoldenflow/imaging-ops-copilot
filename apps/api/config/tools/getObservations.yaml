# Tool registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# side_effect_level read / recommend / action / privileged; schemas are JSON Schema (the subset in
# app/agents/jsonschema.py); fhir_writes is what the tool may write (agents' write rights derive from it).
tool_id: getObservations
description: Observations of an encounter, optionally only some LOINC codes or since a time.
side_effect_level: read
handler: app.agents.handlers:get_observations
domain: fhir
reads:
- Observation
input_schema:
  type: object
  properties:
    encounter_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    codes:
      type: array
      items:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
      maxItems: 20
    since:
      type: string
      pattern: ^\d{4}-\d{2}-\d{2}
  required:
  - encounter_id
  additionalProperties: false
output_schema:
  type: object
  properties:
    resources:
      type: array
      items:
        type: object
  required:
  - resources
  additionalProperties: false
permission_policy:
  roles:
  - physician
  - nurse
  - pharmacist
  - system
  target:
    encounter: encounter_id
idempotency:
  required: false
timeout_ms: 5000
retry:
  max_attempts: 2
  backoff_ms: 50
audit_level: standard
