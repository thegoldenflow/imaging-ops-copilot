# Tool registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# side_effect_level read / recommend / action / privileged; schemas are JSON Schema (the subset in
# app/agents/jsonschema.py); fhir_writes is what the tool may write (agents' write rights derive from it).
tool_id: getMedicationContext
description: 'What a medication review needs for one encounter: the patient, the encounter, its medication orders and
  discharge prescriptions, the home medications, allergies, recent kidney function, INR, potassium and body weight,
  and the diagnosis list (7.2).'
side_effect_level: read
handler: app.modules.med_safety.tools:get_medication_context
domain: fhir
reads:
- Patient
- Encounter
- MedicationRequest
- MedicationStatement
- AllergyIntolerance
- Observation
- Condition
input_schema:
  type: object
  properties:
    encounter_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
  required:
  - encounter_id
  additionalProperties: false
output_schema:
  type: object
  properties:
    resources:
      type: array
      items:
        type: object
  required:
  - resources
  additionalProperties: false
permission_policy:
  roles:
  - physician
  - nurse
  - pharmacist
  - system
  target:
    encounter: encounter_id
idempotency:
  required: false
timeout_ms: 5000
retry:
  max_attempts: 2
  backoff_ms: 50
audit_level: standard
