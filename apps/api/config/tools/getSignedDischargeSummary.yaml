# Tool registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# side_effect_level read / recommend / action / privileged; schemas are JSON Schema (the subset in
# app/agents/jsonschema.py); fhir_writes is what the tool may write (agents' write rights derive from it).
tool_id: getSignedDischargeSummary
description: The encounter, the patient (language preference) and the encounter's discharge summaries written by the
  documentation module; the patient instructions are drafted from a signed one only (7.3).
side_effect_level: read
handler: app.modules.documentation.tools:get_signed_discharge_summary
domain: fhir
reads:
- Encounter
- Patient
- DocumentReference
input_schema:
  type: object
  properties:
    encounter_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
  required:
  - encounter_id
  additionalProperties: false
output_schema:
  type: object
  properties:
    resources:
      type: array
      items:
        type: object
  required:
  - resources
  additionalProperties: false
permission_policy:
  roles:
  - nurse
  - physician
  - system
  target:
    encounter: encounter_id
idempotency:
  required: false
timeout_ms: 5000
retry:
  max_attempts: 2
  backoff_ms: 50
audit_level: standard
