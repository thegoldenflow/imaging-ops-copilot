# Tool registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# side_effect_level read / recommend / action / privileged; schemas are JSON Schema (the subset in
# app/agents/jsonschema.py); fhir_writes is what the tool may write (agents' write rights derive from it).
tool_id: createWorkflowTask
description: 'Open a work item for a durable workflow (6.5): a sign-off to give, an overdue sign-off, a note to the
  operations manager, a failed step to retry or skip, an AI output to review, a NEWS2 flag, a follow-up by hand.'
side_effect_level: action
handler: app.workflows.tools:create_workflow_task
domain: fhir
fhir_writes:
  Task:
  - requested
input_schema:
  type: object
  properties:
    workflow_id:
      type: string
      pattern: ^(journey|capacity|review)-[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    step:
      type: string
      pattern: ^[a-zA-Z][A-Za-z0-9]{1,40}$
    kind:
      type: string
      enum:
      - signoff
      - escalation
      - notify
      - failed
      - review
      - news2
      - manual
    description:
      type: string
      minLength: 1
      maxLength: 1000
    performer_role:
      type: string
      enum:
      - physician
      - nurse
      - pharmacist
      - clerk
      - operations_manager
    priority:
      type: string
      enum:
      - routine
      - urgent
      - asap
      - stat
    encounter_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    unit_id:
      type: string
      pattern: ^[A-Z]{2,5}$
    focus:
      type: string
      pattern: ^[A-Z][A-Za-z]+/[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    inputs:
      type: object
      additionalProperties:
        type: string
        maxLength: 200
  required:
  - workflow_id
  - step
  - kind
  - description
  - performer_role
  additionalProperties: false
output_schema:
  type: object
  properties:
    task_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    status:
      type: string
  required:
  - task_id
  - status
  additionalProperties: false
permission_policy:
  roles:
  - operations_manager
  - system
  # the encounter when the workflow has one (journey, review), else the unit (capacity exceptions)
  target:
    encounter: encounter_id
    unit: unit_id
idempotency:
  required: true
  window_hours: 24
timeout_ms: 5000
retry:
  max_attempts: 2
  backoff_ms: 50
audit_level: detailed
