# Tool registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# side_effect_level read / recommend / action / privileged; schemas are JSON Schema (the subset in
# app/agents/jsonschema.py); fhir_writes is what the tool may write (agents' write rights derive from it).
tool_id: draftClinicalDocument
description: 'Write (or update) the documentation module''s draft of a discharge summary, patient instructions or
  nursing handoff (7.3): a DocumentReference with docStatus preliminary, one per document and encounter (the id
  names both), readable text in one or more languages and the structured content as JSON. A draft whose items do
  not all trace to their sources carries a sign block, which the signing service enforces. Only the signing
  service makes it final; a signed document is not rewritten.'
side_effect_level: recommend
handler: app.modules.documentation.tools:draft_clinical_document
domain: fhir
fhir_writes:
  DocumentReference:
  - preliminary
input_schema:
  type: object
  properties:
    encounter_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    kind:
      type: string
      enum:
      - discharge_summary
      - patient_instructions
      - handoff
    document_id:
      type: string
      pattern: ^(dsum|pinstr|sbar)-[A-Za-z0-9][A-Za-z0-9._-]{0,58}$
    title:
      type: string
      minLength: 1
      maxLength: 200
    texts:
      type: array
      minItems: 1
      maxItems: 3
      items:
        type: object
        properties:
          language:
            type: string
            enum:
            - en
            - zh-Hans
            - zh-Hant
          title:
            type: string
            maxLength: 200
          text:
            type: string
            minLength: 1
            maxLength: 30000
        required:
        - language
        - text
        additionalProperties: false
    data:
      type: string
      minLength: 2
      maxLength: 300000
    source_refs:
      type: array
      maxItems: 200
      items:
        type: string
        pattern: ^[A-Z][A-Za-z]+/[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    sign_block:
      type: string
      maxLength: 500
  required:
  - encounter_id
  - kind
  - document_id
  - title
  - texts
  - data
  additionalProperties: false
output_schema:
  type: object
  properties:
    document_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    doc_status:
      type: string
  required:
  - document_id
  - doc_status
  additionalProperties: false
permission_policy:
  roles:
  - physician
  - nurse
  - system
  target:
    encounter: encounter_id
idempotency:
  required: true
  window_hours: 24
timeout_ms: 5000
retry:
  max_attempts: 2
  backoff_ms: 50
audit_level: detailed
