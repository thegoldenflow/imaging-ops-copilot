# Tool registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# side_effect_level read / recommend / action / privileged; schemas are JSON Schema (the subset in
# app/agents/jsonschema.py); fhir_writes is what the tool may write (agents' write rights derive from it).
tool_id: adjustOrBooking
description: 'Change the booked duration of an operating-room case to the predicted one after the OR coordinator
  (operations manager) approved it (WP9, spec 8.2 step 7). The OR coordinator can also adjust a booking directly
  in the Control Tower.'
side_effect_level: privileged
handler: app.agents.handlers:adjust_or_booking
domain: fhir
fhir_writes:
  Appointment:
  - booked
input_schema:
  type: object
  properties:
    appointment_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    minutes:
      type: integer
      minimum: 15
      maximum: 600
    reason:
      type: string
      minLength: 5
      maxLength: 300
    approval_task_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
  required:
  - appointment_id
  - minutes
  - reason
  - approval_task_id
  additionalProperties: false
output_schema:
  type: object
  properties:
    appointment_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    minutes:
      type: integer
  required:
  - appointment_id
  - minutes
  additionalProperties: false
permission_policy:
  roles:
  - operations_manager
  - system
  approver_roles:
  - operations_manager
  target:
    appointment: appointment_id
idempotency:
  required: true
  window_hours: 24
timeout_ms: 5000
retry:
  max_attempts: 1
  backoff_ms: 0
audit_level: double
