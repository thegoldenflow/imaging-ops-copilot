# Tool registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# side_effect_level read / recommend / action / privileged; schemas are JSON Schema (the subset in
# app/agents/jsonschema.py); fhir_writes is what the tool may write (agents' write rights derive from it).
tool_id: findAppointmentSlots
description: 'Open times to move an appointment to: the same clinic, weekdays in its opening hours over the next two
  weeks, not taken by another booking.'
side_effect_level: read
handler: app.modules.voice_services.tools:find_appointment_slots
domain: fhir
reads:
- Appointment
input_schema:
  type: object
  properties:
    appointment_id:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
    count:
      type: integer
      minimum: 1
      maximum: 5
  required:
  - appointment_id
  additionalProperties: false
output_schema:
  type: object
  properties:
    slots:
      type: array
      maxItems: 5
      items:
        type: object
        properties:
          start:
            type: string
          minutes:
            type: integer
        required:
        - start
        - minutes
        additionalProperties: false
  required:
  - slots
  additionalProperties: false
permission_policy:
  roles:
  - physician
  - nurse
  - clerk
  - system
  target:
    appointment: appointment_id
idempotency:
  required: false
timeout_ms: 5000
retry:
  max_attempts: 2
  backoff_ms: 50
audit_level: standard
