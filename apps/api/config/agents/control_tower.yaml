# Agent registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# kind: runtime_agent (hosted by the agent runtime) | embedded_agent (AI step inside its module) |
# module (no model; registered for its EHR writes). Model ids come from the environment (model_policy.tier).
#
# The Control Tower (7.1): its module (app/modules/control_tower) reads the boards through FhirGateway under
# this entry's data scope; its agent (the entrypoint) writes the narrative and recommended actions of an
# exception the rule engine found (explainException) and, after a bed manager or charge nurse approved them,
# one Task per action for its owner role (createFlowTask). It never executes an action itself.
agent_id: control_tower
version: 0.2.0
kind: runtime_agent
owner: Patient flow team
purpose: 'Hospital flow: ED, bed and OR boards, exceptions with a narrative and recommended actions (7.1).'
risk_tier: ops
allowed_tools:
- getBedBoard
- getEncounterContext
- getOrders
- explainException
- createFlowTask
- submitForReview
- createTask
- updateTask
- appendEncounterLocation
data_scope:
  resources:
  - Location
  - Encounter
  - Patient
  - ServiceRequest
  - Appointment
  - Procedure
  - Observation
  - Task
  - Flag
  scope: hospital
model_policy:
  tier: reasoning
  max_tokens: 4000
  temperature_max: null
prompt_version: control_tower@1
required_signoff_role:
- operations_manager
- nurse
consent_required: []
eval_status:
  status: pending
  run_id: evals/control_tower/report.json
  note: 'Rule engine 20/20 scenarios; narrator 30/30 schema-valid with 100% resolvable evidence (mock model).
    The spec''s human rating of narrative accuracy (>= 4/5) has not been done, so the status stays pending.'
deployment_status: demo
entrypoint: app.modules.control_tower.agent
