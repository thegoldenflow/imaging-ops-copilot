# Agent registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# kind: runtime_agent (hosted by the agent runtime) | embedded_agent (AI step inside its module) |
# module (no model; registered for its EHR writes). Model ids come from the environment (model_policy.tier).
agent_id: control_tower
version: 0.1.0
kind: runtime_agent
owner: Patient flow team
purpose: 'Hospital flow: bed board, exceptions and recommended actions (7.1).'
risk_tier: ops
allowed_tools:
- getBedBoard
- getEncounterContext
- getOrders
- submitForReview
- createTask
- updateTask
- appendEncounterLocation
data_scope:
  resources:
  - Location
  - Encounter
  - Patient
  - ServiceRequest
  - Appointment
  - Task
  - Flag
  scope: hospital
model_policy:
  tier: reasoning
  max_tokens: 4000
  temperature_max: null
prompt_version: null
required_signoff_role:
- operations_manager
consent_required: []
eval_status:
  status: pending
deployment_status: dev
entrypoint: null
