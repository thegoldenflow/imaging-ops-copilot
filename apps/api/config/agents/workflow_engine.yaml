# Agent registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# kind: runtime_agent (hosted by the agent runtime) | embedded_agent (AI step inside its module) |
# module (no model; registered for its EHR writes). Model ids come from the environment (model_policy.tier).
agent_id: workflow_engine
version: 1.0.0
kind: module
owner: Hospital platform team
purpose: 'The durable workflows themselves (6.5): Tasks for sign-offs, escalations, failed steps and reviews, and
  the follow-up call booked after a clerk approved it. Its tool calls run in Temporal activities.'
risk_tier: ops
allowed_tools:
- getEncounterContext
- createWorkflowTask
- updateTask
- proposeAppointment
- bookAppointment
data_scope:
  resources:
  - Patient
  - Encounter
  - Flag
  - Task
  scope: hospital
prompt_version: null
required_signoff_role: []
consent_required: []
eval_status:
  status: not_applicable
deployment_status: demo
