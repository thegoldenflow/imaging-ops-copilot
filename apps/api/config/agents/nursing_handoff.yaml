# Agent registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# kind: runtime_agent (hosted by the agent runtime) | embedded_agent (AI step inside its module) |
# module (no model; registered for its EHR writes). Model ids come from the environment (model_policy.tier).
agent_id: nursing_handoff
version: 0.2.0
kind: runtime_agent
owner: Clinical documentation team
purpose: SBAR nursing handoff per shift and patient from the last 12 hours (7.3); the nurse's confirmation
  makes it final.
risk_tier: documentation
allowed_tools:
- getEncounterBundle
- getObservations
- getHandoffContext
- draftDocument
- draftClinicalDocument
- signDocumentFinal
data_scope:
  resources:
  - Patient
  - Encounter
  - Observation
  - Task
  - Flag
  - MedicationRequest
  - Condition
  - Procedure
  scope: own_unit
model_policy:
  tier: reasoning
  max_tokens: 4000
  timeout_s: 60  # long synthesis calls; LLM_TIMEOUT_S (30 s) stays for the rest
  temperature_max: null
prompt_version: nursing_handoff@1
required_signoff_role:
- nurse
consent_required:
- ai_processing
eval_status:
  status: pending
  note: mock baseline in evals/documentation (30 cases); a live-model run and the human rating are outstanding
deployment_status: demo
entrypoint: app.modules.documentation.handoff_agent
# Release gate (6.6): the share of eval cases that must succeed: no red item, automated proxies at 4 or more.
eval_threshold: 0.9
