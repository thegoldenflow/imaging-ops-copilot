# Agent registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# kind: runtime_agent (hosted by the agent runtime) | embedded_agent (AI step inside its module) |
# module (no model; registered for its EHR writes). Model ids come from the environment (model_policy.tier).
agent_id: order_review
version: 0.1.0
kind: runtime_agent
owner: Pharmacy and medication safety team
purpose: Order and medication safety review comments (7.2).
risk_tier: clinical_ds
allowed_tools:
- getEncounterBundle
- getOrders
- getMedications
- getHomeMeds
- getObservations
- draftDocument
- submitForReview
- createTask
- updateTask
- createFlag
- updateFlag
- signDocumentFinal
data_scope:
  resources:
  - Patient
  - Encounter
  - ServiceRequest
  - MedicationRequest
  - MedicationStatement
  - AllergyIntolerance
  - Observation
  - Condition
  - DiagnosticReport
  - DocumentReference
  scope: own_unit
model_policy:
  tier: reasoning
  max_tokens: 8000
  temperature_max: null
prompt_version: null
required_signoff_role:
- pharmacist
- physician
consent_required:
- ai_processing
eval_status:
  status: pending
deployment_status: dev
entrypoint: null
