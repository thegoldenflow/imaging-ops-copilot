# Agent registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# kind: runtime_agent (hosted by the agent runtime) | embedded_agent (AI step inside its module) |
# module (no model; registered for its EHR writes). Model ids come from the environment (model_policy.tier).
#
# The order review (7.2): its module (app/modules/med_safety) runs the deterministic rules on every new order and
# reads the EHR through FhirGateway under this entry's data scope; its agent (the entrypoint) writes the
# appropriateness commentary after the rules and puts it into the reviewer's queue (submitOrderReview). After a
# person asked for a change, the agent writes the prescriber's Task (createTask). It never blocks and never changes
# an order: only rules block, and a pharmacist or physician decides.
agent_id: order_review
version: 0.2.0
kind: runtime_agent
owner: Pharmacy and medication safety team
purpose: Order and medication safety review comments (7.2).
risk_tier: clinical_ds
allowed_tools:
- getMedicationContext
- getServiceOrderContext
- getEncounterBundle
- getOrders
- getMedications
- getHomeMeds
- getObservations
- submitOrderReview
- draftDocument
- submitForReview
- createTask
- updateTask
- createFlag
- updateFlag
- signDocumentFinal
data_scope:
  resources:
  - Patient
  - Encounter
  - ServiceRequest
  - MedicationRequest
  - MedicationStatement
  - AllergyIntolerance
  - Observation
  - Condition
  - DiagnosticReport
  - DocumentReference
  scope: own_unit
model_policy:
  tier: reasoning
  max_tokens: 8000
  timeout_s: 45  # healthy calls up to ~20 s; half of 30 s cuts each attempt at ~12.5 s (casebook 3.16)
  temperature_max: null
prompt_version: order_review@1
required_signoff_role:
- pharmacist
- physician
consent_required:
- ai_processing
eval_status:
  status: pending
  run_id: evals/order_review/report.json
  note: 'Mock baseline only (60 labelled synthetic cases: schema validity, evidence resolution, precision and recall
    of flagged concerns; see the report). The mock is written by the author of the labels, so it is optimistic; the
    status stays pending until the configured model has been run on the set (scripts/med_safety_eval.py --live).'
deployment_status: demo
entrypoint: app.modules.med_safety.review_agent
confidence_threshold: 0.7
# Release gate (6.6): the share of eval cases that must succeed: flagged concern types equal the labels; precision and recall gates apply too.
eval_threshold: 0.8
