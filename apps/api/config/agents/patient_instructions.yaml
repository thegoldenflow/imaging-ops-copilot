# Agent registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# kind: runtime_agent (hosted by the agent runtime) | embedded_agent (AI step inside its module) |
# module (no model; registered for its EHR writes). Model ids come from the environment (model_policy.tier).
agent_id: patient_instructions
version: 0.2.0
kind: runtime_agent
owner: Clinical documentation team
purpose: Bilingual patient discharge instructions from the signed discharge summary only (7.3); the model picks
  codes from menus, English and Chinese are rendered from that one structure.
risk_tier: documentation
allowed_tools:
- getDocuments
- getSignedDischargeSummary
- draftDocument
- draftClinicalDocument
- submitForReview
- createTask
- updateTask
- signDocumentFinal
data_scope:
  resources:
  - Patient
  - Encounter
  - DocumentReference
  scope: own_unit
model_policy:
  tier: reasoning
  max_tokens: 8000
  temperature_max: null
prompt_version: patient_instructions@1
required_signoff_role:
- nurse
consent_required:
- ai_processing
eval_status:
  status: pending
  note: mock baseline in evals/documentation (30 cases); a live-model run and the human rating are outstanding
deployment_status: demo
entrypoint: app.modules.documentation.instructions_agent
