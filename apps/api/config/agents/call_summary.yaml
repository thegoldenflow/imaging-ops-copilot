# Agent registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# kind: runtime_agent (hosted by the agent runtime) | embedded_agent (AI step inside its module) |
# module (no model; registered for its EHR writes). Model ids come from the environment (model_policy.tier).
agent_id: call_summary
version: 1.0.0
kind: embedded_agent
owner: Imaging AI team
purpose: Summarise a front-desk phone call for the call log (System 4).
risk_tier: ops
allowed_tools: []
data_scope:
  resources: []
  scope: none
model_policy:
  tier: fast
  max_tokens: 8000
  temperature_max: null
prompt_version: call_summary@1
required_signoff_role: []
consent_required: []
eval_status:
  status: pending
  run_id: null
  note: Eval set evals/voice_agent (the summaries of its 20 scripted calls); pending until a live run.
deployment_status: demo
# Release gate (6.6): the share of call summaries that name every action of the call, claim none that did not
# happen and flag follow-up exactly when the call was put through; no unsupported claim at all (gate).
eval_threshold: 0.9
