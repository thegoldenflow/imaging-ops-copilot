# Agent registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# kind: runtime_agent (hosted by the agent runtime) | embedded_agent (AI step inside its module) |
# module (no model; registered for its EHR writes). Model ids come from the environment (model_policy.tier).
agent_id: voice_services
version: 1.0.0
kind: module
owner: Patient services team
purpose: 'Patient voice services without a model (7.4): the nurse follow-up queue (call-back notes, closing an
  escalation, a referral to a physician: each a Communication), the manual follow-up Task when a call cannot be
  made (no consent, no phone, instructions not signed, no discharge time), and the rules-only call centre and
  follow-up calls when the release gate refuses the call_center or followup_calls agent (prod mode before their
  evals pass): the same tools, keyword rules instead of the model, every clinical answer still a nurse''s.'
risk_tier: ops
allowed_tools:
- findCaller
- getPatientAppointments
- findAppointmentSlots
- proposeAppointment
- moveAppointment
- cancelBookedAppointment
- writeCallRecord
- createCallTask
- recordPatientReportedObservation
- updateTask
data_scope:
  resources:
  - Patient
  - Encounter
  - Appointment
  - Communication
  - Task
  scope: hospital
prompt_version: null
required_signoff_role:
- nurse
consent_required: []
eval_status:
  status: not_applicable
deployment_status: demo
