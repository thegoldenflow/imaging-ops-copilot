# Agent registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# kind: runtime_agent (hosted by the agent runtime) | embedded_agent (AI step inside its module) |
# module (no model; registered for its EHR writes). Model ids come from the environment (model_policy.tier).
#
# WP9 (spec 8.2 steps 2 and 3): the ED's suggestion cards. The triage assist (app/modules/control_tower/triage.py:
# CTAS-style modifiers and the Control Tower's admission model) and the imaging-order card (the imaging centre's
# own pipeline: urgency and protocol per exam). Each card carries the EHR action it stands for; the EHR records it
# when the nurse or physician accepts the card (app/ehr/accepted.py). No language model of its own.
agent_id: ed_decision_support
version: 1.0.0
kind: module
owner: Emergency department and patient flow team
purpose: 'ED decision support (7.1 triage view, imaging orders): suggestion cards a nurse or physician accepts.'
risk_tier: clinical_ds
allowed_tools:
- suggestEhrAction
data_scope:
  resources:
  - Patient
  - Encounter
  - Observation
  - MedicationStatement
  - Task
  scope: hospital
prompt_version: null
required_signoff_role:
- nurse
- physician
consent_required: []
eval_status:
  status: not_applicable
  note: 'Rules and the Control Tower flow model (evaluated in apps/api/models/flow/report.md); the storyline report
    evals/storyline/report.md checks the cards end to end.'
deployment_status: demo
