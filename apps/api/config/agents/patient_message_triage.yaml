# Agent registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# kind: runtime_agent (hosted by the agent runtime) | embedded_agent (AI step inside its module) |
# module (no model; registered for its EHR writes). Model ids come from the environment (model_policy.tier).
agent_id: patient_message_triage
version: 0.1.0
kind: runtime_agent
owner: Hospital platform team
purpose: 'Triage a message from a patient or family about a current or recent stay: record it, summarise it, route
  clinical or urgent ones to the nurse and draft a reply for the nurse to review. Reference agent of the runtime
  (6.4).'
risk_tier: ops
allowed_tools:
- getEncounterContext
- writeCommunication
- submitForReview
- createTask
data_scope:
  resources:
  - Patient
  - Encounter
  - Flag
  scope: encounter
model_policy:
  tier: fast
  max_tokens: 2000
  temperature_max: null
prompt_version: patient_message_triage@1
required_signoff_role:
- nurse
consent_required:
- ai_processing
eval_status:
  status: pending
  run_id: null
  note: Only the prompt-injection set (evals/injection) so far; no triage-quality eval.
deployment_status: demo
entrypoint: app.agents.library.patient_message_triage
confidence_threshold: 0.7
