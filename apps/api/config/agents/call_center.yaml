# Agent registry entry (docs/SPEC-hospital.md 6.4; loader app/agents/registry.py).
# kind: runtime_agent (hosted by the agent runtime) | embedded_agent (AI step inside its module) |
# module (no model; registered for its EHR writes). Model ids come from the environment (model_policy.tier).
agent_id: call_center
version: 0.2.0
kind: runtime_agent
owner: Patient services team
purpose: 'Hospital call centre (7.4): recognise what a caller wants (reschedule or cancel, appointment lookup,
  visiting hours / locations / parking, prep instructions, a clinical question, a person), verify the caller in code
  before anything personal, propose appointment changes for a clerk to confirm and route clinical questions to the
  nurse line. It never answers a medical question.'
risk_tier: ops
allowed_tools:
- findCaller
- getPatientAppointments
- findAppointmentSlots
- proposeAppointment
- moveAppointment
- cancelBookedAppointment
- writeCallRecord
- createCallTask
data_scope:
  resources:
  - Patient
  - Encounter
  - Appointment
  scope: hospital
model_policy:
  tier: voice
  max_tokens: 600
  temperature_max: null
prompt_version: call_center@1
required_signoff_role:
- clerk
consent_required: []
eval_status:
  status: pending
  run_id: null
  note: Mock baseline only (evals/call_center, evals/voice_bilingual); not run on a live model.
deployment_status: demo
entrypoint: app.modules.voice_services.call_agent
