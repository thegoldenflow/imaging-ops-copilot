[project]
name = "imaging-ops-api"
version = "0.1.0"
description = "Imaging Ops Copilot backend (demo, synthetic data only)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "anthropic>=1.0",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "google-genai>=2.28.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "cryptography>=43",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
